
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEQUOIA – Plan interactif</title>
  <style>
    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f2f5f8;
    }
    h2 { color: #173b60; }
    .plan {
      position: relative;
      width: 100%;
      max-width: 1500px;
      margin: auto;
    }
    .plan img {
      display: block;
      width: 100%;
      height: auto;
    }
    .repere {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #0866cc;
      color: white;
      border: 2px solid white;
      border-radius: 20px;
      padding: 6px 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>PALAIS – Niveau 1</h2>
<p>Cliquez sur un mobilier pour consulter sa fiche.</p>

<div class="plan">
  <img src="Niveau%201.png" alt="Plan d'implantation niveau 1">

  <button class="repere" style="left:15%;top:29%"
    onclick="ouvrirMobilier('DM4')">DM4</button>

  <button class="repere" style="left:20%;top:29%"
    onclick="ouvrirMobilier('DB3')">DB3</button>

  <button class="repere" style="left:20%;top:60%"
    onclick="ouvrirMobilier('RC12')">RC12</button>

  <button class="repere" style="left:78%;top:50%"
    onclick="ouvrirMobilier('CA0')">CA0</button>
</div>

<script>
  function ouvrirMobilier(repere) {
window.location.href = "https://www.appsheet.com/start/d77fd0d8-c2a5-4bd0-b3f8-ba35e11a7a63#view=REFERENCEMENT_Detail&row=R018";
  }
</script>

</body>
</html>
