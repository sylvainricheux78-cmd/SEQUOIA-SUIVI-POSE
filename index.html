
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEQUOIA – Plan interactif</title>
  <style>
    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f2f5f8;
    }
    h2 { color: #173b60; }
    .plan {
      position: relative;
      width: 100%;
      max-width: 1500px;
      margin: auto;
    }
    .plan img {
      display: block;
      width: 100%;
      height: auto;
    }
    .repere {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #0866cc;
      color: white;
      border: 2px solid white;
      border-radius: 20px;
      padding: 6px 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>PALAIS – Niveau 1</h2>
<p>Cliquez sur un mobilier pour consulter sa fiche.</p>

<div class="plan">
  <img src="Niveau%201.png" alt="Plan d'implantation niveau 1">

  <button class="repere" style="left:15%;top:29%"
    onclick="ouvrirMobilier('DM4')">DM4</button>

  <button class="repere" style="left:20%;top:29%"
    onclick="ouvrirMobilier('DB3')">DB3</button>

  <button class="repere" style="left:20%;top:60%"
    onclick="ouvrirMobilier('RC12')">RC12</button>

  <button class="repere" style="left:78%;top:50%"
    onclick="ouvrirMobilier('CA0')">CA0</button>

<button class="repere" style="left:83%;top:75%"
  onclick="ouvrirMobilier('DA1')">DA1</button>
  
<button class="repere" style="left:19%;top:38%"
  onclick="ouvrirMobilier('DI4')">DI4</button>
  
<button class="repere" style="left:24%;top:29%"
  onclick="ouvrirMobilier('TF')">TF</button>

<button class="repere" style="left:62%;top:29%"
  onclick="ouvrirMobilier('RC11')">RC11</button>

<button class="repere" style="left:71%;top:29%"
  onclick="ouvrirMobilier('DC4')">DC4</button>

<button class="repere" style="left:75%;top:35%"
  onclick="ouvrirMobilier('DM3')">DM3</button>

<button class="repere" style="left:85%;top:29%"
  onclick="ouvrirMobilier('DM1')">DM1</button>

<button class="repere" style="left:89%;top:35%"
  onclick="ouvrirMobilier('DI5')">DI5</button>

<button class="repere" style="left:24%;top:76%"
  onclick="ouvrirMobilier('DG3')">DG3</button>

<button class="repere" style="left:30%;top:76%"
  onclick="ouvrirMobilier('DB1')">DB1</button>

<button class="repere" style="left:35%;top:76%"
  onclick="ouvrirMobilier('DI3')">DI3</button>

<button class="repere" style="left:66%;top:75%"
  onclick="ouvrirMobilier('DP2')">DP2</button>

<button class="repere" style="left:79%;top:68%"
  onclick="ouvrirMobilier('RC8')">RC8</button>

<button class="repere" style="left:84%;top:68%"
  onclick="ouvrirMobilier('DP4')">DP4</button>

</div>


<script>
  const mobiliers = {
    "DM4": "R001",
    "DB3": "R002",
    "DI4": "R003",
    "RC12": "R004",
    "TF": "R008",
    "RC11": "R009",
    "DC4": "R010",
    "DM3": "R011",
    "DM1": "R012",
    "DI5": "R013",
    "DG3": "R014",
    "DB1": "R015",
    "DI3": "R016",
    "DP2": "R017",
    "CA0": "R018",
    "RC8": "R019",
    "DP4": "R020",
    "DA1": "R021"
  };

  function ouvrirMobilier(repere) {
    const id = mobiliers[repere];

    if (!id) {
      alert("Mobilier introuvable : " + repere);
      return;
    }

    window.location.href =
      "https://www.appsheet.com/start/d77fd0d8-c2a5-4bd0-b3f8-ba35e11a7a63#view=REFERENCEMENT_Detail&row=" + id;
  }
</script>
