
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEQUOIA – Plan interactif</title>
  <style>
    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f2f5f8;
    }
    h2 { color: #173b60; }
    .plan {
      position: relative;
      width: 100%;
      max-width: 1500px;
      margin: auto;
    }
    .plan img {
      display: block;
      width: 100%;
      height: auto;
    }
    .repere {
      position: absolute;
      transform: translate(-50%, -50%);
      background: #0866cc;
      color: white;
      border: 2px solid white;
      border-radius: 20px;
      padding: 6px 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div style="margin-bottom:15px;">
  <button onclick="afficherNiveau(1)">Niveau 1</button>
  <button onclick="afficherNiveau(2)">Niveau 2</button>
</div>
  
<h2>PALAIS – Niveau 1</h2>
<p>Cliquez sur un mobilier pour consulter sa fiche.</p>

<div class="plan">
  <img src="Niveau%201.png" alt="Plan d'implantation niveau 1">

  
<button class="repere" style="left:14%;top:33.89%" onclick="ouvrirMobilier('DM4')">DM4</button>
<button class="repere" style="left:19.8%;top:28.29%" onclick="ouvrirMobilier('DB3')">DB3</button>
<button class="repere" style="left:19.6%;top:56.43%" onclick="ouvrirMobilier('RC12')">RC12</button>
<button class="repere" style="left:78%;top:50%" onclick="ouvrirMobilier('CA0')">CA0</button>
<button class="repere" style="left:81.93%;top:72.96%" onclick="ouvrirMobilier('DA1')">DA1</button>
<button class="repere" style="left:16.93%;top:42.69%" onclick="ouvrirMobilier('DI4')">DI4</button>
<button class="repere" style="left:26.53%;top:35.76%" onclick="ouvrirMobilier('TF')">TF</button>
<button class="repere" style="left:60.4%;top:34.29%" onclick="ouvrirMobilier('RC11')">RC11</button>
<button class="repere" style="left:69.93%;top:29.49%" onclick="ouvrirMobilier('DC4')">DC4</button>
<button class="repere" style="left:74.93%;top:44.96%" onclick="ouvrirMobilier('DM3')">DM3</button>
<button class="repere" style="left:80.53%;top:34.69%" onclick="ouvrirMobilier('DM1')">DM1</button>
<button class="repere" style="left:85.67%;top:26.29%" onclick="ouvrirMobilier('DI5')">DI5</button>
<button class="repere" style="left:13.13%;top:66.03%" onclick="ouvrirMobilier('DG3')">DG3</button>
<button class="repere" style="left:19.33%;top:65.63%" onclick="ouvrirMobilier('DB1')">DB1</button>
<button class="repere" style="left:19.73%;top:73.09%" onclick="ouvrirMobilier('DI3')">DI3</button>
<button class="repere" style="left:67.87%;top:57.63%" onclick="ouvrirMobilier('DP2')">DP2</button>
<button class="repere" style="left:82%;top:57.49%" onclick="ouvrirMobilier('RC8')">RC8</button>
<button class="repere" style="left:82.67%;top:66.29%" onclick="ouvrirMobilier('DP4')">DP4</button>

</div>

  <div id="niveau2" style="display:none;">
  <div class="plan">
    <img src="Niveau%202.png" alt="Palais - Niveau 2">
  </div>
</div>
  

<script>
  const mobiliers = {
    "DM4": "R001",
    "DB3": "R002",
    "DI4": "R003",
    "RC12": "R004",
    "TF": "R008",
    "RC11": "R009",
    "DC4": "R010",
    "DM3": "R011",
    "DM1": "R012",
    "DI5": "R013",
    "DG3": "R014",
    "DB1": "R015",
    "DI3": "R016",
    "DP2": "R017",
    "CA0": "R018",
    "RC8": "R019",
    "DP4": "R020",
    "DA1": "R021"
  };

  function ouvrirMobilier(repere) {
    const id = mobiliers[repere];

    if (!id) {
      alert("Mobilier introuvable : " + repere);
      return;
    }

    window.location.href =
      "https://www.appsheet.com/start/d77fd0d8-c2a5-4bd0-b3f8-ba35e11a7a63#view=REFERENCEMENT_Detail&row=" + id;
  }
</script>


  
<style>
  .mode-positionnement {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 1000;
    padding: 12px;
    background: #173b60;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  body.edition .repere {
    cursor: grab;
    touch-action: none;
  }

  #coordonnees {
    position: fixed;
    bottom: 12px;
    left: 12px;
    z-index: 1000;
    background: white;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    max-height: 35vh;
    overflow: auto;
    font: 12px monospace;
    white-space: pre-wrap;
  }
</style>

<button class="mode-positionnement"
        onclick="basculerEdition()">
  Activer le positionnement
</button>

<pre id="coordonnees" hidden></pre>

<script>
  let modeEdition = false;
  let deplacement = null;

  function basculerEdition() {
    modeEdition = !modeEdition;
    document.body.classList.toggle("edition", modeEdition);

    document.querySelector(".mode-positionnement").textContent =
      modeEdition
        ? "Terminer le positionnement"
        : "Activer le positionnement";

    document.getElementById("coordonnees").hidden = !modeEdition;

    if (modeEdition) afficherCoordonnees();
  }

  const plan = document.querySelector(".plan");

  document.querySelectorAll(".repere").forEach(bouton => {
    bouton.addEventListener("pointerdown", e => {
      if (!modeEdition) return;

      e.preventDefault();
      deplacement = bouton;
      bouton.setPointerCapture(e.pointerId);
    });

    bouton.addEventListener("pointermove", e => {
      if (!modeEdition || deplacement !== bouton) return;

      const rect = plan.getBoundingClientRect();

      const x = Math.max(0, Math.min(100,
        (e.clientX - rect.left) / rect.width * 100));

      const y = Math.max(0, Math.min(100,
        (e.clientY - rect.top) / rect.height * 100));

      bouton.style.left = x.toFixed(2) + "%";
      bouton.style.top = y.toFixed(2) + "%";

      afficherCoordonnees();
    });

    bouton.addEventListener("pointerup", () => {
      deplacement = null;
    });

    bouton.addEventListener("click", e => {
      if (modeEdition) {
        e.preventDefault();
        e.stopImmediatePropagation();
      }
    }, true);
  });

  function afficherCoordonnees() {
    const lignes = [...document.querySelectorAll(".repere")]
      .map(b => {
        return b.textContent.trim() + " : " +
          b.style.left + " / " + b.style.top;
      });

    document.getElementById("coordonnees").textContent =
      lignes.join("\n");
  }
</script>

  <script>
function afficherNiveau(niveau) {
  document.getElementById("niveau2").style.display =
    niveau === 2 ? "block" : "none";

  document.querySelector("body > .plan").style.display =
    niveau === 1 ? "block" : "none";

  document.querySelector("h2").textContent =
    "PALAIS – Niveau " + niveau;
}
</script>
  
  </body>
</html>
